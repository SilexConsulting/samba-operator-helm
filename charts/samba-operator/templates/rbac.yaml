{{- $fullname := include "samba-operator.fullname" . -}}
{{- $sa := include "samba-operator.serviceAccountName" . -}}
# Rules from upstream config/rbac (v0.8), unchanged.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-manager-role
  labels:
    {{- include "samba-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [apps]
    resources: [statefulsets]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [create, delete, get, list, update, watch]
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [endpoints, namespaces, pods, services]
    verbs: [get, list, update, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create]
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [""]
    resources: [services]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules, servicemonitors]
    verbs: [create, get, list, update, watch]
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [rolebindings, roles]
    verbs: [create, delete, get, list, update, watch]
  - apiGroups: [samba-operator.samba.org]
    resources: [smbcommonconfigs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [samba-operator.samba.org]
    resources: [smbcommonconfigs/status]
    verbs: [get, patch, update]
  - apiGroups: [samba-operator.samba.org]
    resources: [smbsecurityconfigs]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [samba-operator.samba.org]
    resources: [smbsecurityconfigs/status]
    verbs: [get, patch, update]
  - apiGroups: [samba-operator.samba.org]
    resources: [smbshares]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [samba-operator.samba.org]
    resources: [smbshares/finalizers]
    verbs: [get, patch, update]
  - apiGroups: [samba-operator.samba.org]
    resources: [smbshares/status]
    verbs: [get, patch, update]
  - apiGroups: [security.openshift.io]
    resources: [securitycontextconstraints]
    verbs: [get, list, use]
  - apiGroups: [security.openshift.io]
    resourceNames: [samba]
    resources: [securitycontextconstraints]
    verbs: [create, get, list, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-manager-rolebinding
  labels:
    {{- include "samba-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-manager-role
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $fullname }}-leader-election-role
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "samba-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [configmaps/status]
    verbs: [get, update, patch]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, create, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $fullname }}-leader-election-rolebinding
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "samba-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $fullname }}-leader-election-role
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.metrics.authProxy.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-proxy-role
  labels:
    {{- include "samba-operator.labels" . | nindent 4 }}
rules:
  - apiGroups: [authentication.k8s.io]
    resources: [tokenreviews]
    verbs: [create]
  - apiGroups: [authorization.k8s.io]
    resources: [subjectaccessreviews]
    verbs: [create]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $fullname }}-proxy-rolebinding
  labels:
    {{- include "samba-operator.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $fullname }}-proxy-role
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ .Release.Namespace }}
---
# Grant to whatever scrapes /metrics (e.g. Prometheus' ServiceAccount).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $fullname }}-metrics-reader
  labels:
    {{- include "samba-operator.labels" . | nindent 4 }}
rules:
  - nonResourceURLs: [/metrics]
    verbs: [get]
{{- end }}
